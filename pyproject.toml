[project]
name = "ec418-circor"
version = "0.1.0"
description = "EC418: patient-level, leakage-audited wavelet murmur detection on CirCor (WEKA + Python)"
requires-python = ">=3.11"
dependencies = [
  "numpy", "scipy", "pandas", "pywavelets", "scikit-learn", "matplotlib",
  "soundfile", "librosa", "seaborn", "pytest",
]

[project.optional-dependencies]
writeup = ["python-pptx"]  # report/EC418_slides.pptx (scripts/p4_slides.py); the PDF needs tectonic (brew install tectonic)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
